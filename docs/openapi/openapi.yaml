openapi: 3.0.4
info:
  title: Bookstore API
  version: 1.0.0
  description: |-
    Book inventory API for the Bookstore service.

    Primary contract uses `/books` and `/books/{id}`.
    Legacy compatibility routes remain temporarily available and are marked as deprecated.
servers:
  - url: __API_BASE_PATH__
    description: Runtime API base path
tags:
  - name: health
    description: Service health and diagnostics
  - name: books
    description: Book inventory operations
paths:
  /health:
    get:
      tags: [health]
      summary: Service health check
      description: Returns service health and current trace id.
      security: []
      responses:
        '200':
          description: Service is available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /books:
    get:
      tags: [books]
      summary: List books
      description: Returns all books, or filters by supported category name.
      security: []
      parameters:
        - $ref: '#/components/parameters/CategoryQuery'
      responses:
        '200':
          description: Book list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Book'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [books]
      summary: Create book
      description: Creates a book. `categoryName` is preferred; legacy `categoryId` string alias is still accepted during transition.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookRequest'
      responses:
        '201':
          description: Book created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      deprecated: true
      tags: [books]
      summary: Legacy update route
      description: Deprecated compatibility route. Prefer `PUT /books/{id}`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LegacyUpdateBookRequest'
      responses:
        '200':
          description: Book updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /books/{id}:
    get:
      tags: [books]
      summary: Get book by id
      description: Returns one book by MongoDB ObjectId.
      security: []
      parameters:
        - $ref: '#/components/parameters/BookIdPath'
      responses:
        '200':
          description: Matching book.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [books]
      summary: Update stock or active status
      description: Updates mutable inventory fields for one book.
      security: []
      parameters:
        - $ref: '#/components/parameters/BookIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBookRequest'
      responses:
        '200':
          description: Updated book.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /books/single:
    get:
      deprecated: true
      tags: [books]
      summary: Legacy single-book lookup
      description: Deprecated compatibility route. Prefer `GET /books/{id}`.
      security: []
      parameters:
        - $ref: '#/components/parameters/LegacyIdQuery'
        - $ref: '#/components/parameters/LegacyNameQuery'
        - $ref: '#/components/parameters/LegacyAuthorQuery'
      responses:
        '200':
          description: Matching book.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /books/health:
    get:
      deprecated: true
      tags: [health]
      summary: Legacy health check
      description: Deprecated compatibility route. Prefer `GET /health`.
      security: []
      responses:
        '200':
          description: Service is available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
components:
  parameters:
    CategoryQuery:
      name: category
      in: query
      required: false
      description: Supported category name. Allowed values: Fiction, Non-Fiction, Science, Biography, Children, Programming.
      schema:
        type: string
    BookIdPath:
      name: id
      in: path
      required: true
      description: MongoDB ObjectId for the target book.
      schema:
        type: string
    LegacyIdQuery:
      name: id
      in: query
      required: false
      schema:
        type: string
    LegacyNameQuery:
      name: name
      in: query
      required: false
      schema:
        type: string
    LegacyAuthorQuery:
      name: author
      in: query
      required: false
      schema:
        type: string
  responses:
    BadRequest:
      description: Request validation failed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: Requested resource was not found.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    InternalServerError:
      description: Unexpected server error.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  schemas:
    Book:
      type: object
      required: [id, title, quantity, categoryId, active]
      properties:
        id:
          type: string
        title:
          type: string
        author:
          type: string
          nullable: true
        categoryId:
          type: integer
        quantity:
          type: integer
        description:
          type: string
          nullable: true
        language:
          type: string
          nullable: true
        active:
          type: boolean
        inactiveDate:
          type: string
          format: date-time
          nullable: true
        publisher:
          type: string
          nullable: true
        publisherDate:
          type: string
          format: date-time
          nullable: true
    CreateBookRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
        author:
          type: string
        categoryName:
          type: string
          description: Preferred category field.
        categoryId:
          type: string
          deprecated: true
          description: Legacy alias that still accepts category name text during transition.
        quantity:
          type: integer
        description:
          type: string
        language:
          type: string
        active:
          type: boolean
          default: true
        inactiveDate:
          type: string
          format: date-time
        publisher:
          type: string
        publisherDate:
          type: string
          format: date-time
    UpdateBookRequest:
      type: object
      properties:
        quantity:
          type: integer
        active:
          type: boolean
      description: At least one field is required.
    LegacyUpdateBookRequest:
      allOf:
        - $ref: '#/components/schemas/UpdateBookRequest'
        - type: object
          required: [id]
          properties:
            id:
              type: string
    HealthStatus:
      type: object
      required: [status, traceId]
      properties:
        status:
          type: string
          example: UP
        traceId:
          type: string
    ProblemDetails:
      type: object
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          description: Trace id URI for support correlation.
