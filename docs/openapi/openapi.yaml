openapi: 3.0.4
info:
  title: Bookstore API
  version: 1.1.0
  description: |-
    Book inventory and author management API for the Bookstore service.

    Primary contract uses `/authors`, `/books`, and `/books/{id}`.
    Legacy compatibility routes remain temporarily available and are marked as deprecated.
servers:
  - url: __API_BASE_PATH__
    description: Runtime API base path
tags:
  - name: health
    description: Service health and diagnostics
  - name: authors
    description: Author management operations
  - name: books
    description: Book inventory operations
paths:
  /health:
    get:
      tags: [health]
      summary: Service health check
      description: Returns service health and current trace id.
      security: []
      responses:
        '200':
          description: Service is available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /authors:
    get:
      tags: [authors]
      summary: List authors
      description: Returns all authors or filters by active state.
      security: []
      parameters:
        - $ref: '#/components/parameters/ActiveQuery'
      responses:
        '200':
          description: Author list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Author'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [authors]
      summary: Create author
      description: Creates a first-class author record.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAuthorRequest'
      responses:
        '201':
          description: Author created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Author'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /authors/{id}:
    get:
      tags: [authors]
      summary: Get author by id
      description: Returns one author by MongoDB ObjectId, including inactive authors.
      security: []
      parameters:
        - $ref: '#/components/parameters/AuthorIdPath'
      responses:
        '200':
          description: Matching author.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Author'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [authors]
      summary: Soft-delete author
      description: Marks an author as inactive without removing the record.
      security: []
      parameters:
        - $ref: '#/components/parameters/AuthorIdPath'
      responses:
        '200':
          description: Author marked inactive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Author'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /books:
    get:
      tags: [books]
      summary: List books
      description: Returns all books, or filters by supported category name, author id, or both.
      security: []
      parameters:
        - $ref: '#/components/parameters/CategoryQuery'
        - $ref: '#/components/parameters/AuthorIdQuery'
      responses:
        '200':
          description: Book list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Book'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [books]
      summary: Create book
      description: |-
        Creates a book. `categoryName` is preferred; legacy `categoryId` string alias is still accepted during transition.

        `authorId` is preferred for canonical author linkage. If omitted, legacy `author` text is used to resolve an active author by name or create a minimal author record automatically.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookRequest'
      responses:
        '201':
          description: Book created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      deprecated: true
      tags: [books]
      summary: Legacy update route
      description: Deprecated compatibility route. Prefer `PUT /books/{id}`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LegacyUpdateBookRequest'
      responses:
        '200':
          description: Book updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /books/{id}:
    get:
      tags: [books]
      summary: Get book by id
      description: Returns one book by MongoDB ObjectId.
      security: []
      parameters:
        - $ref: '#/components/parameters/BookIdPath'
      responses:
        '200':
          description: Matching book.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [books]
      summary: Update stock or active status
      description: Updates mutable inventory fields for one book.
      security: []
      parameters:
        - $ref: '#/components/parameters/BookIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBookRequest'
      responses:
        '200':
          description: Updated book.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /books/single:
    get:
      deprecated: true
      tags: [books]
      summary: Legacy single-book lookup
      description: Deprecated compatibility route. Prefer `GET /books/{id}`.
      security: []
      parameters:
        - $ref: '#/components/parameters/LegacyIdQuery'
        - $ref: '#/components/parameters/LegacyNameQuery'
        - $ref: '#/components/parameters/LegacyAuthorQuery'
      responses:
        '200':
          description: Matching book.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /books/health:
    get:
      deprecated: true
      tags: [health]
      summary: Legacy health check
      description: Deprecated compatibility route. Prefer `GET /health`.
      security: []
      responses:
        '200':
          description: Service is available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
components:
  parameters:
    ActiveQuery:
      name: active
      in: query
      required: false
      description: Optional active-state filter for authors.
      schema:
        type: boolean
    CategoryQuery:
      name: category
      in: query
      required: false
      description: Supported category name. Allowed values: Fiction, Non-Fiction, Science, Biography, Children, Programming.
      schema:
        type: string
    AuthorIdQuery:
      name: authorId
      in: query
      required: false
      description: Canonical author identifier used to filter books.
      schema:
        type: string
    AuthorIdPath:
      name: id
      in: path
      required: true
      description: MongoDB ObjectId for the target author.
      schema:
        type: string
    BookIdPath:
      name: id
      in: path
      required: true
      description: MongoDB ObjectId for the target book.
      schema:
        type: string
    LegacyIdQuery:
      name: id
      in: query
      required: false
      schema:
        type: string
    LegacyNameQuery:
      name: name
      in: query
      required: false
      schema:
        type: string
    LegacyAuthorQuery:
      name: author
      in: query
      required: false
      schema:
        type: string
  responses:
    BadRequest:
      description: Request validation failed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: Requested resource was not found.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Conflict:
      description: Request conflicts with current resource state.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    InternalServerError:
      description: Unexpected server error.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  schemas:
    Author:
      type: object
      required: [id, name, active, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        birthDate:
          type: string
          format: date-time
          nullable: true
        nationality:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Book:
      type: object
      required: [id, title, quantity, active]
      properties:
        id:
          type: string
        title:
          type: string
        authorId:
          type: string
          nullable: true
        author:
          type: string
          nullable: true
        categoryId:
          type: integer
          nullable: true
        quantity:
          type: integer
        description:
          type: string
          nullable: true
        language:
          type: string
          nullable: true
        active:
          type: boolean
        inactiveDate:
          type: string
          format: date-time
          nullable: true
        publisher:
          type: string
          nullable: true
        publisherDate:
          type: string
          format: date-time
          nullable: true
    CreateAuthorRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 255
        birthDate:
          type: string
          format: date-time
        nationality:
          type: string
        email:
          type: string
    CreateBookRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
        authorId:
          type: string
          description: Preferred canonical author reference.
        author:
          type: string
          description: Legacy compatibility author field. Used to resolve or create an author when `authorId` is absent.
        categoryName:
          type: string
          description: Preferred category field.
        categoryId:
          type: string
          deprecated: true
          description: Legacy alias that still accepts category name text during transition.
        quantity:
          type: integer
        description:
          type: string
        language:
          type: string
        active:
          type: boolean
          default: true
        inactiveDate:
          type: string
          format: date-time
        publisher:
          type: string
        publisherDate:
          type: string
          format: date-time
    UpdateBookRequest:
      type: object
      properties:
        quantity:
          type: integer
        active:
          type: boolean
      description: At least one field is required.
    LegacyUpdateBookRequest:
      allOf:
        - $ref: '#/components/schemas/UpdateBookRequest'
        - type: object
          required: [id]
          properties:
            id:
              type: string
    HealthStatus:
      type: object
      required: [status, traceId]
      properties:
        status:
          type: string
          example: UP
        traceId:
          type: string
    ProblemDetails:
      type: object
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          description: Trace id URI for support correlation.
